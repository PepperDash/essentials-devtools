<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Dev Tools is served at /cws/debug/ on an appliance and under /VirtualControl/Rooms/<RoomId>/
      // on VC-4. Set <base> from the page's own path so the relative asset URLs resolve from the app
      // root, including on deep links such as .../cws/debug/app01/versions. Match the /cws/debug
      // mount itself, not the first /cws/, since a VC-4 room can be named CWS. Keep in step with
      // getHostLayout in src/shared/functions/hostPaths.ts. Must stay above every link and script tag.
      (function () {
        var path = window.location.pathname;
        var mount = /\/cws\/debug(?:\/|$)/i.exec(path);
        if (!mount) return;
        var base = document.createElement('base');
        base.href = path.slice(0, mount.index) + '/cws/debug/';
        document.head.appendChild(base);
      })();
    </script>
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Essentials Web Config App" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Essentials Dev Tools</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
